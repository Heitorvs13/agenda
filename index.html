<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <script type="module" src="./js/app.js" defer></script>
    <title>Agenda</title>
</head>

<body>
    <section class="formulario">
        <h1>Cadastro de Contato</h1>
        <form id="form-contato">
            <section class="linha">
                <label for="name" hidden>Nome</label>
                <input type="text" id="name" name="name" placeholder="Informe o nome" required>
                <button type="button" id="favorite" class="favorite">
                    <svg class="fav-true" viewBox="0 0 51 48" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M25.203 0L31.1526 18.3111H50.406L34.8297 29.6279L40.7793 47.9389L25.203 36.6221L9.62669 47.9389L15.5763 29.6279L5.72205e-06 18.3111H19.2534L25.203 0Z" />
                    </svg>
                </button>
            </section>
            <label for="fone" hidden>Telefone</label>
            <input type="tel" id="fone" name="fone" placeholder="Informe o telefone" required>
            <label for="email" hidden>E-mail</label>
            <input type="email" id="email" name="email" placeholder="Informe o email" required>

        </form>
        <button id="save-contact" class="save">Salvar</button>
    </section>

    <section class="pesquisa">
        <form>
            <label for="search" hidden></label>
            <input type="text" id="search" name="search" placeholder="Busque por nome, telefone ou e-mail">
            <button type="button">
                <svg width="54" height="54" viewBox="0 0 54 54" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="54" height="54" rx="26.5" fill="#E5E4E4" />
                    <path
                        d="M39.6667 42L29.1667 31.5C28.3333 32.1667 27.375 32.6944 26.2917 33.0833C25.2083 33.4722 24.0556 33.6667 22.8333 33.6667C19.8056 33.6667 17.2431 32.6181 15.1458 30.5208C13.0486 28.4236 12 25.8611 12 22.8333C12 19.8056 13.0486 17.2431 15.1458 15.1458C17.2431 13.0486 19.8056 12 22.8333 12C25.8611 12 28.4236 13.0486 30.5208 15.1458C32.6181 17.2431 33.6667 19.8056 33.6667 22.8333C33.6667 24.0556 33.4722 25.2083 33.0833 26.2917C32.6944 27.375 32.1667 28.3333 31.5 29.1667L42 39.6667L39.6667 42ZM22.8333 30.3333C24.9167 30.3333 26.6875 29.6042 28.1458 28.1458C29.6042 26.6875 30.3333 24.9167 30.3333 22.8333C30.3333 20.75 29.6042 18.9792 28.1458 17.5208C26.6875 16.0625 24.9167 15.3333 22.8333 15.3333C20.75 15.3333 18.9792 16.0625 17.5208 17.5208C16.0625 18.9792 15.3333 20.75 15.3333 22.8333C15.3333 24.9167 16.0625 26.6875 17.5208 28.1458C18.9792 29.6042 20.75 30.3333 22.8333 30.3333Z"
                        fill="#3B3B3B" />
                </svg>

            </button>
        </form>
    </section>

    <main class="agenda">
        <header class="filtros">
            <button type="button" class="filters" filter="favs" aria-pressed="false">
                <svg class="icone" viewBox="0 0 49 48" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M25.203 0L31.1526 18.3111H50.406L34.8297 29.6279L40.7793 47.9389L25.203 36.6221L9.62669 47.9389L15.5763 29.6279L5.72205e-06 18.3111H19.2534L25.203 0Z" />
                </svg>
            </button>
            <section class="alfabeticos">
                <button type="button" class="filters" filter="A-D" aria-pressed="false">
                    A-D
                </button>
                <button type="button" class="filters" filter="E-H" aria-pressed="false">
                    E-H
                </button>
                <button type="button" class="filters" filter="I-L" aria-pressed="false">
                    I-L
                </button>
                <button type="button" class="filters" filter="M-P" aria-pressed="false">
                    M-P
                </button>
                <button type="button" class="filters" filter="Q-T" aria-pressed="false">
                    Q-T
                </button>
                <button type="button" class="filters" filter="U-Z" aria-pressed="false">
                    U-Z
                </button>
            </section>
            <button type="button" class="filters" filter="all" aria-pressed="true">
                Todos
            </button>
        </header>
        <section class="contatos">
            <article class="contato">
                <section class="dados">
                    <header>
                        <h1>Nome do Contato</h1>
                        <svg class="fav-false" height="10px" viewBox="0 0 49 48" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M25.203 0L31.1526 18.3111H50.406L34.8297 29.6279L40.7793 47.9389L25.203 36.6221L9.62669 47.9389L15.5763 29.6279L5.72205e-06 18.3111H19.2534L25.203 0Z" />
                        </svg>
                    </header>
                    <ul>
                        <li>Telefone: +55 54 99999-9999</li>
                        <li>E-mail: email@exemplo.com.br</li>
                    </ul>
                </section>
                <section class="operacoes">
                    <button type="button" class="delete">
                        <svg viewBox="0 0 25 25" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M4.6875 25C3.82812 25 3.09245 24.728 2.48047 24.184C1.86849 23.64 1.5625 22.9861 1.5625 22.2222V4.16667H0V1.38889H7.8125V0H17.1875V1.38889H25V4.16667H23.4375V22.2222C23.4375 22.9861 23.1315 23.64 22.5195 24.184C21.9076 24.728 21.1719 25 20.3125 25H4.6875ZM20.3125 4.16667H4.6875V22.2222H20.3125V4.16667ZM7.8125 19.4444H10.9375V6.94444H7.8125V19.4444ZM14.0625 19.4444H17.1875V6.94444H14.0625V19.4444Z" />
                        </svg>
                    </button>
                    <button type="button" class="edit">
                        <svg viewBox="0 0 25 25" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M2.77778 22.2222H4.75694L18.3333 8.64583L16.3542 6.66667L2.77778 20.2431V22.2222ZM0 25V19.0972L18.3333 0.798611C18.6111 0.543981 18.9178 0.347222 19.2535 0.208333C19.5891 0.0694444 19.9421 0 20.3125 0C20.6829 0 21.0417 0.0694444 21.3889 0.208333C21.7361 0.347222 22.037 0.555556 22.2917 0.833333L24.2014 2.77778C24.4792 3.03241 24.6817 3.33333 24.809 3.68056C24.9363 4.02778 25 4.375 25 4.72222C25 5.09259 24.9363 5.4456 24.809 5.78125C24.6817 6.1169 24.4792 6.42361 24.2014 6.70139L5.90278 25H0ZM17.3264 7.67361L16.3542 6.66667L18.3333 8.64583L17.3264 7.67361Z" />
                        </svg>
                    </button>
                </section>
            </article>
        </section>
    </main>
</body>

</html>
